name: Deploy Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_production:
        description: Type PROMOTE for a production deployment
        required: false
        type: string

concurrency:
  group: server-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Validate Worker types
        working-directory: server
        run: npm run typecheck
      - name: Validate resource configuration
        working-directory: server
        run: ./scripts/verify-deploy-config.sh "${{ inputs.environment }}"
      - name: Require explicit production promotion
        if: inputs.environment == 'production' && inputs.confirm_production != 'PROMOTE'
        run: |
          echo 'Production requires confirm_production=PROMOTE.' >&2
          exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: server
          command: deploy --env ${{ inputs.environment }}
      - name: Run privacy-safe smoke checks
        working-directory: server
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: ./scripts/smoke.sh "$SMOKE_BASE_URL"
