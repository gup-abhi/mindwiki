name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
        # --ignore-scripts skips native module builds (node-gyp, pod-install)
        # that fail on Linux CI. All native modules are mocked in jest.setup.js.

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts
        # Server sources are imported by root-level boundary tests, so their
        # dependencies must be available before the root TypeScript check.

      - name: TypeScript check
        run: yarn tsc --noEmit

      - name: Server TypeScript check
        working-directory: server
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: yarn lint

      - name: Server lint (zero warnings)
        working-directory: server
        run: npm run lint

      - name: Test with coverage
        run: bash .claude/scripts/run-jest.sh --ci --coverage
        # Jest/native mocks verify JavaScript behavior only; they do not prove physical-device behavior.

      - name: Verify coverage report
        run: test -f coverage/coverage-summary.json

      - name: Verify privacy and lifecycle suites
        run: bash .claude/scripts/run-jest.sh __tests__/services/auth __tests__/services/sync __tests__/services/storage __tests__/services/notifications __tests__/server __tests__/app __tests__/components
        # Physical-device accessibility, native, and encrypted-storage verification remains a separate device gate.
