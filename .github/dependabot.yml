version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-react-native:
        patterns:
          - expo*
          - '@expo/*'
          - '*react-native*'
      crypto:
        patterns:
          - '@noble/*'
          - '@scure/*'
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps-server)
    labels:
      - dependencies
      - server

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
      - github-actions
