name = "mindwiki-server"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Default target: local Miniflare only. Replace the staging/production resource
# identifiers below after provisioning them in Cloudflare; identifiers are not
# credentials and may be committed, while secrets remain in Wrangler/GitHub.
kv_namespaces = [{ binding = "AUTH_KV", id = "local_dev_auth_kv" }]
r2_buckets = [{ binding = "R2", bucket_name = "mindwiki-sync-local" }]

durable_objects.bindings = [{ name = "AUTH_COORDINATOR", class_name = "AuthCoordinator" }]

[[migrations]]
tag = "v1"
new_classes = ["AuthCoordinator"]

[env.staging]
name = "mindwiki-server-staging"
kv_namespaces = [{ binding = "AUTH_KV", id = "00000000000000000000000000000000" }]
r2_buckets = [{ binding = "R2", bucket_name = "mindwiki-staging-placeholder" }]
durable_objects.bindings = [{ name = "AUTH_COORDINATOR", class_name = "AuthCoordinator" }]

[env.production]
name = "mindwiki-server-production"
kv_namespaces = [{ binding = "AUTH_KV", id = "11111111111111111111111111111111" }]
r2_buckets = [{ binding = "R2", bucket_name = "mindwiki-production-placeholder" }]
durable_objects.bindings = [{ name = "AUTH_COORDINATOR", class_name = "AuthCoordinator" }]
