<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" width="430" height="120" role="img" aria-label="MindWiki">
  <!-- Mark: rounded tile + "M" graph -->
  <g>
    <rect x="6" y="6" width="108" height="108" rx="25" fill="#2F4739"/>
    <g transform="translate(6,6) scale(0.9)">
      <path d="M 37,82 L 37,42 L 60,63 L 83,42 L 83,82"
            fill="none" stroke="#9FC4AC" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#F4EFE7">
        <circle cx="37" cy="82" r="6"/>
        <circle cx="37" cy="42" r="6"/>
        <circle cx="83" cy="42" r="6"/>
        <circle cx="83" cy="82" r="6"/>
      </g>
      <circle cx="60" cy="63" r="7.2" fill="#E0BE72"/>
    </g>
  </g>

  <!-- Wordmark (Lora serif). Two text elements with explicit x for consistent rendering. -->
  <text x="132" y="74" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#2F4739">Mind</text>
  <text x="240" y="74" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#3C6450">Wiki</text>
</svg>
