<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MindWiki app icon">
  <!-- App-icon tile -->
  <rect width="120" height="120" rx="27" fill="#2F4739"/>

  <!-- "M" as a knowledge graph, centred with generous padding so launcher masks
       (incl. Samsung's zoomed squircle) never crop the nodes -->
  <path d="M 44,75 L 44,49 L 60,63 L 76,49 L 76,75"
        fill="none" stroke="#9FC4AC" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F4EFE7">
    <circle cx="44" cy="75" r="5"/>
    <circle cx="44" cy="49" r="5"/>
    <circle cx="76" cy="49" r="5"/>
    <circle cx="76" cy="75" r="5"/>
  </g>
  <circle cx="60" cy="63" r="6" fill="#E0BE72"/>  <!-- focal thought -->
</svg>
