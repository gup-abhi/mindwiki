<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MindWiki app icon">
  <!-- App-icon tile -->
  <rect width="120" height="120" rx="27" fill="#2F4739"/>

  <!-- "M" drawn as a knowledge graph: nodes (your pages) + edges (their links) -->
  <path d="M 37,82 L 37,42 L 60,63 L 83,42 L 83,82"
        fill="none" stroke="#9FC4AC" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F4EFE7">
    <circle cx="37" cy="82" r="5.6"/>
    <circle cx="37" cy="42" r="5.6"/>
    <circle cx="83" cy="42" r="5.6"/>
    <circle cx="83" cy="82" r="5.6"/>
  </g>
  <circle cx="60" cy="63" r="6.8" fill="#E0BE72"/>  <!-- the focal thought at the centre -->
</svg>
